#cloud-config
package_upgrade: true

users:
  - name: [YOUR-USERNAME]
    groups: sudo
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
    ssh_authorized_keys:
      - "[YOUR-PUBKEY1]"
      - "[YOUR-PUBKEY2]"

runcmd:
  # 1. SSH Hardening
  - "sed -i 's/^#\\?PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config"
  - "sed -i 's/^#\\?PubkeyAuthentication.*/PubkeyAuthentication yes/' /etc/ssh/sshd_config"
  - "sed -i 's/^#\\?PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config"
  - "sed -i 's/^#\\?StrictModes.*/StrictModes yes/' /etc/ssh/sshd_config"
  - "sed -i 's/^#\\?MaxAuthTries.*/MaxAuthTries 6/' /etc/ssh/sshd_config"
  - "sed -i 's/^#\\?MaxSessions.*/MaxSessions 10/' /etc/ssh/sshd_config"
  - "sed -i 's/^#\\?LoginGraceTime.*/LoginGraceTime 2m/' /etc/ssh/sshd_config"
  - systemctl restart sshd

  # 2. Disable "Needrestart" prompts
  - mkdir -p /etc/needrestart/conf.d
  - 'echo "\$nrconf{kernelhints} = -1;" > /etc/needrestart/conf.d/99disable-prompt.conf'

  # 3. Package Management
  - apt update
  - apt install unattended-upgrades -y
  - dpkg-reconfigure -f noninteractive unattended-upgrades

  # 4. Swap Space
  - |
    RAM_MB=$(free -m | awk '/^Mem:/{print $2}')
    if [ "$RAM_MB" -le 2048 ]; then
      SWAP_SIZE="${RAM_MB}M"
    elif [ "$RAM_MB" -le 8192 ]; then
      SWAP_SIZE="$((RAM_MB / 2))M"
    else
      SWAP_SIZE="4G"
    fi
    dd if=/dev/zero of=/swapfile bs=1M count=$(echo $SWAP_SIZE | sed 's/M//')
    chmod 600 /swapfile
    mkswap /swapfile
    swapon /swapfile
    echo '/swapfile none swap sw 0 0' >> /etc/fstab
    sysctl -w vm.swappiness=10
    sysctl -w vm.dirty_ratio=10
    sysctl -w vm.dirty_background_ratio=5

  # 5. Disk Optimization
  - "sed -i 's/\\(defaults\\)/\\1,noatime/' /etc/fstab"
  - "sed -i 's/\\(errors=remount-ro\\)/\\1,noatime/' /etc/fstab"

  # 6. Weekly Maintenance Reboot (4 AM Sunday)
  - (crontab -l 2>/dev/null; echo "0 4 * * sun /sbin/shutdown -r now") | crontab -

power_state:
  delay: "now"
  mode: reboot
  message: "Cloud-init complete, rebooting for configuration."
  condition: True

